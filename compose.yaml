name: ai-ttx-capstone
services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - '127.0.0.1:${TTX_PORT:-3000}:3000'
    environment:
      TTX_HOST: 0.0.0.0
      TTX_PORT: 3000
      TTX_PUBLIC_PORT: ${TTX_PORT:-3000}
      TTX_DATA_DIR: /data
      TTX_CONTAINER: 'true'
      TTX_AI_ENABLED: 'false'
    volumes:
      - exercise-data:/data
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  exercise-data:
